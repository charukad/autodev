name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ai_office:ai_office@localhost:5432/ai_office?schema=public
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: ai_office
      POSTGRES_USER: ai_office
      POSTGRES_PASSWORD: ai_office
      REDIS_URL: redis://localhost:6379/0
      REDIS_DB: 0
      REDIS_KEY_PREFIX: "ai-office:"
      REDIS_DEFAULT_TTL_SECONDS: 3600
      TASK_QUEUE_PREFIX: ai-office
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_office
          POSTGRES_USER: ai_office
          POSTGRES_PASSWORD: ai_office
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_office -d ai_office"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Apply Database Migrations
        run: npm run db:deploy

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
