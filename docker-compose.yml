services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-office-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_office}
      POSTGRES_USER: ${POSTGRES_USER:-ai_office}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_office}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_office} -d ${POSTGRES_DB:-ai_office}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai-office-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
